<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - GreenTopUp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #e0f2f1; /* Hijau pastel */
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #3a414e;
        }
        .auth-card {
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
        }
        .auth-image-side {
            background-color: #a7ffeb; /* Aksen hijau terang */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        .auth-form-side {
            padding: 50px;
        }
        .form-control {
            background-color: #fbfbfc;
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 0.9rem;
        }
        .form-control:focus {
            border-color: #00796b;
            box-shadow: 0 0 10px rgba(0,121,107,0.1);
        }
        .btn-green {
            background-color: #00796b;
            color: #fff;
            font-weight: 600;
            border-radius: 50px;
            padding: 12px;
            width: 100%;
            transition: 0.3s;
            border: none;
        }
        .btn-green:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,121,107,0.3);
        }
    </style>
</head>
<body>

    <div class="container px-4">
        <div class="auth-card row mx-0">
            <div class="col-md-6 auth-image-side d-none d-md-flex">
                <img src="gambar .png" alt="Zeta Chibi" class="img-fluid" style="max-height: 350px;">
            </div>
            <div class="col-md-6 auth-form-side">
                <div class="text-center mb-4">
                    <img src="logo robux.png" alt="Logo" height="50" class="mb-3">
                    <h3 class="fw-bold">Selamat Datang Kembali!</h3>
                    <p class="text-secondary small">Silakan masuk ke akun ZetaTopUp kamu.</p>
                </div>
                
                <form action="index.html">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Username / Email</label>
                        <input type="text" class="form-control" placeholder="Masukkan username atau email">
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-secondary">Password</label>
                        <input type="password" class="form-control" placeholder="Masukkan password">
                    </div>
                    <div class="d-flex justify-content-between mb-4 small">
                        <div>
                            <input type="checkbox" id="remember"> <label for="remember">Ingat Saya</label>
                        </div>
                        <a href="#" style="color: #00796b; text-decoration: none;">Lupa Password?</a>
                    </div>
                    <button type="submit" class="btn btn-green mb-3">Sign In</button>
                    <div class="text-center small">
                        Belum punya akun? <a href="signup.html" style="color: #00796b; font-weight: bold; text-decoration: none;">Daftar di sini</a>
                    </div>
                    <div class="text-center mt-3 small">
                        <a href="index.html" class="text-muted text-decoration-none"><i class="fas fa-arrow-left"></i> Kembali ke Beranda</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
