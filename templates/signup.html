<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - GreenTopUp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #e0f2f1;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #3a414e;
            padding: 20px 0;
        }
        .auth-card {
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
        }
        .auth-image-side {
            background-color: #a7ffeb;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        .auth-form-side {
            padding: 40px 50px;
        }
        .form-control {
            background-color: #fbfbfc;
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 0.9rem;
        }
        .form-control:focus {
            border-color: #00796b;
            box-shadow: 0 0 10px rgba(0,121,107,0.1);
        }
        .btn-green {
            background-color: #00796b;
            color: #fff;
            font-weight: 600;
            border-radius: 50px;
            padding: 12px;
            width: 100%;
            transition: 0.3s;
            border: none;
        }
        .btn-green:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,121,107,0.3);
        }
    </style>
</head>
<body>

    <div class="container px-4">
        <div class="auth-card row mx-0">
            <div class="col-md-7 auth-form-side">
                <div class="mb-4">
                    <img src="logo.png" alt="Logo" height="40" class="mb-2">
                    <h3 class="fw-bold">Buat Akun Baru</h3>
                    <p class="text-secondary small">Mulai perjalanan gamingmu bersama GreenTopUp.</p>
                </div>
                
                <form action="signin.html">
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label small fw-bold text-secondary">Nama Depan</label>
                            <input type="text" class="form-control" placeholder="Nama Depan">
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-bold text-secondary">Nama Belakang</label>
                            <input type="text" class="form-control" placeholder="Nama Belakang">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Email</label>
                        <input type="email" class="form-control" placeholder="contoh@email.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Password</label>
                        <input type="password" class="form-control" placeholder="Buat password yang kuat">
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-secondary">Konfirmasi Password</label>
                        <input type="password" class="form-control" placeholder="Ulangi password">
                    </div>
                    <button type="submit" class="btn btn-green mb-3">Daftar Sekarang</button>
                    <div class="text-center small">
                        Sudah punya akun? <a href="signin.html" style="color: #00796b; font-weight: bold; text-decoration: none;">Masuk di sini</a>
                    </div>
                </form>
            </div>
            <div class="col-md-5 auth-image-side d-none d-md-flex flex-column text-center">
                <img src="character.png" alt="Zeta Chibi" class="img-fluid mb-4" style="max-height: 250px;">
                <h5 class="fw-bold" style="color: #00796b;">Gabung Bersama Kami!</h5>
                <p class="small text-dark">Dapatkan promo menarik dan kemudahan transaksi hanya untuk member.</p>
            </div>
        </div>
    </div>

</body>
</html>
